name: huimeng
services:
  migration:
    image: ${HM_IMAGE:-huimeng-api:m3}
    user: '10001:10001'
    profiles: [migration]
    env_file: /opt/apps/huimeng/secrets/migration.env
    command: [--migrate-only]
    networks: [database]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    image: ${HM_IMAGE:-huimeng-api:m3}
    container_name: huimeng-api
    user: '10001:10001'
    env_file: /opt/apps/huimeng/secrets/api.env
    environment:
      HM_BIND_ADDRESS: 0.0.0.0
      HM_PORT: 18085
      HM_PUBLIC_ORIGIN: https://192.168.1.102:18443
      HM_WORKSPACE_ROOT: /data/huimeng/workspaces
    volumes:
      - /opt/apps/huimeng/secrets/master.key:/run/huimeng-secrets/master.key:ro
      - /opt/apps/huimeng/secrets/internal.key:/run/huimeng-secrets/internal.key:ro
      - /opt/apps/huimeng/secrets/bootstrap-password:/run/huimeng-secrets/bootstrap-password:ro
      - /data/huimeng/workspaces:/data/huimeng/workspaces
    # entry/executor/database 都是 internal 网络，容器没有默认路由，出不去；
    # 模型供应商、插件市场与本地 ComfyUI 都在外部，必须有一条出口网络。
    networks: [entry, executor, database, egress]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # GraalJS 引擎与节点包登记需要额外常驻内存，1g 下工具执行容易触顶。
    mem_limit: 1536m
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  boundary:
    image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    container_name: huimeng-boundary
    user: '10001:10001'
    command: [bun, run, /app/server.ts]
    environment:
      HM_BIND_ADDRESS: 0.0.0.0
      HM_INTERNAL_KEY_FILE: /run/huimeng-secrets/internal.key
      HM_WORKSPACE_ROOT: /data/huimeng/workspaces
    volumes:
      - /opt/apps/huimeng/executor-boundary:/app:ro
      - /opt/apps/huimeng/secrets/internal.key:/run/huimeng-secrets/internal.key:ro
      - /data/huimeng/workspaces:/data/huimeng/workspaces:ro
    networks: [executor]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    logging: *logs
  web:
    image: nginx@sha256:05b8cb60c354a44ab824ea6e7dc69b46d50762cdbe728a347a5b656e6fb3d7c4
    container_name: huimeng-web
    ports: ['192.168.1.102:18443:443']
    volumes:
      - /opt/apps/huimeng/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/apps/huimeng/secrets/tls:/etc/nginx/tls:ro
      - /var/www/huimeng:/usr/share/nginx/html:ro
    networks: [entry, ingress]
    depends_on: [api]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE,CHOWN,SETUID,SETGID,DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    logging: *logs
networks:
  ingress: {}
  entry:
    internal: true
  executor:
    internal: true
  # 唯一允许出网的网络，只挂 API；容器不发布端口，入口仍由 nginx 收口。
  egress: {}
  database:
    external: true
    name: huimeng_database
