      - limit
      - type
    MarketItem:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        type:
          type: string
          enum:
          - node
          - ext
          - skill
          - tool
          - agent
        name:
          type: string
        displayName:
          type: string
        author:
          type: string
        description:
          type: string
        version:
          type: string
        fileName:
          type: string
        isCollected: *id005
        installable: *id005
        manifest:
          oneOf:
          - $ref: '#/components/schemas/PluginManifest'
          - *id007
      required:
      - id
      - type
      - name
      - displayName
      - author
      - description
      - version
      - fileName
      - isCollected
      - installable
      - manifest
    MarketResult:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
