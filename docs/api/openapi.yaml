components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: __Host-huimeng-session
    ExternalBearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
        details:
          oneOf:
          - type: object
          - &id007
            type: 'null'
      required:
      - code
      - message
      - requestId
      - details
    ErrorCode:
      type: string
      enum:
      - INVALID_ARGUMENT
      - PATH_NOT_ALLOWED
      - UNAUTHENTICATED
      - CLIENT_TOKEN_INVALID
      - CSRF_INVALID
      - PROJECT_FORBIDDEN
      - CAPABILITY_FORBIDDEN
      - NOT_FOUND
      - REVISION_CONFLICT
      - IDEMPOTENCY_CONFLICT
      - PROJECT_CAPACITY_EXCEEDED
      - RATE_LIMITED
      - EXECUTOR_UNAVAILABLE
      - RUN_LOST
      - PLUGIN_INTEGRITY_FAILED
      - PLUGIN_VERSION_CONFLICT
      - PLUGIN_IN_USE
      - MARKET_UNAVAILABLE
      - UPLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - FILE_ALREADY_EXISTS
      - DIRECTORY_NOT_EMPTY
      - FILE_OPERATION_INCOMPLETE
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        username: &id006
          type: string
          minLength: 1
          maxLength: 128
        role:
          type: string
          enum:
          - ADMIN
          - USER
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      required:
      - id
      - username
      - role
      - status
    Login:
      type: object
      additionalProperties: false
      properties:
        username: *id006
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
      required:
      - username
      - password
    CreateUser:
      type: object
      additionalProperties: false
      properties:
        username: *id006
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
        role:
          type: string
          enum:
          - ADMIN
          - USER
          default: USER
      required:
      - username
      - password
    UpdateUser:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        role:
          type: string
          enum:
          - ADMIN
          - USER
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
      minProperties: 1
    Project:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id006
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
      required:
      - id
      - name
      - status
    ProjectInput:
      type: object
      additionalProperties: false
      properties:
        name: *id006
      required:
      - name
    ProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id006
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
      minProperties: 1
    MemberInput:
      type: object
      additionalProperties: false
      properties:
        userId: *id002
      required:
      - userId
    Member:
