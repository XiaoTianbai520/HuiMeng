      required:
      - type
      - name
      - version
      - sha256
    PluginInstall:
      type: object
      additionalProperties: false
      properties:
        pluginId: *id002
        manifest:
          $ref: '#/components/schemas/PluginManifest'
        force: *id005
      required:
      - pluginId
      - manifest
    InstalledPlugin:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - node
          - ext
          - skill
          - tool
          - agent
        name: *id006
        displayName:
          type: string
        author:
          type: string
        description:
          type: string
        version: *id006
        enabled: *id005
        canManage: *id005
        canConfigure: *id005
        configRules:
          type: array
